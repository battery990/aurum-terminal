<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07080a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="AURUM — 黄金 CFD 多周期智能行情分析终端" />
    <title>AURUM · 黄金 CFD 智能分析</title>
    <style>
      html,
      body {
        margin: 0;
        background: #07080a;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #07080a;
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #boot .mark {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: linear-gradient(145deg, #f6d98a, #c9962f);
        box-shadow: 0 0 40px rgba(231, 184, 75, 0.25);
        animation: bootPulse 1.4s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.94);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot"><div class="mark"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
